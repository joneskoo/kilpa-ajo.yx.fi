<html lang="fi">
<head>

  <!-- Kotivalikkoon lisättävä peli (iPhone: Jaa → Lisää Koti-valikkoon), toimii myös ilman verkkoa -->
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icon-180.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

  <style>*{box-sizing:border-box;margin:0;padding:0}body{background:#000;justify-content:center;align-items:center;height:100vh;display:flex;overflow:hidden}canvas{touch-action:none;display:block}body{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;touch-action:none}body.touch #restartBtn,body.touch #fullscreenBtn{top:14px;bottom:auto}#fullscreenBtn{color:#ccc;cursor:pointer;z-index:10;background:#000000b3;border:1px solid #555;padding:8px 14px;font-size:15px;position:fixed;bottom:14px;right:14px}#fullscreenBtn:hover{color:#fff;border-color:#aaa}#restartBtn{color:#ccc;cursor:pointer;z-index:10;background:#000000b3;border:1px solid #555;padding:8px 14px;font-size:15px;position:fixed;bottom:14px;left:14px}#restartBtn:hover{color:#fff;border-color:#aaa}</style>
  <script type="module" crossorigin src="/assets/index-BM4SXoqV.js"></script>
</head>
<body>
  <canvas id="peliCanvas"></canvas>
  <button id="restartBtn">↺ Valikkoon</button>
  <button id="fullscreenBtn">⛶ Koko näyttö</button>
  <script>
    const btn = document.getElementById('fullscreenBtn');
    // iPhonessa koko näytön nappia ei ole: peli on koko näytöllä, kun se avataan kotivalikosta
    if (!document.documentElement.requestFullscreen) btn.style.display = 'none';
    btn.addEventListener('click', () => {
      if (document.fullscreenElement) {
        document.exitFullscreen();
        btn.textContent = '⛶ Koko näyttö';
      } else {
        document.documentElement.requestFullscreen();
        btn.textContent = '✕ Poistu';
      }
    });
  </script>
</body>
</html>
