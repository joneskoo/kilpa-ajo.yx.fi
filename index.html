<!DOCTYPE html>
<html lang="fi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Kilpa-ajo 1</title>
  <!-- Kotivalikkoon lisättävä peli (iPhone: Jaa → Lisää Koti-valikkoon), toimii myös ilman verkkoa -->
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icon-180.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Kilpa-ajo 1">
  <meta name="theme-color" content="#000000">
  <style>*{box-sizing:border-box;margin:0;padding:0}html,body{background:#000;height:100%;overflow:hidden}#stage{top:env(safe-area-inset-top,0px);right:env(safe-area-inset-right,0px);bottom:env(safe-area-inset-bottom,0px);left:env(safe-area-inset-left,0px);justify-content:center;align-items:center;display:flex;position:fixed}canvas{touch-action:none;display:block}#rotateHint{top:calc(env(safe-area-inset-top,0px) + 8px);color:gold;z-index:20;white-space:nowrap;background:#000000bf;border:1px solid gold;border-radius:8px;padding:8px 14px;font:700 15px sans-serif;display:none;position:fixed;left:50%;transform:translate(-50%)}@media (orientation:portrait) and (pointer:coarse){#rotateHint{display:block}}body{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;touch-action:none}body.touch #restartBtn,body.touch #fullscreenBtn{top:calc(env(safe-area-inset-top,0px) + 14px);bottom:auto}#fullscreenBtn{bottom:calc(env(safe-area-inset-bottom,0px) + 14px);right:calc(env(safe-area-inset-right,0px) + 14px);color:#ccc;cursor:pointer;z-index:10;background:#000000b3;border:1px solid #555;padding:8px 14px;font-size:15px;position:fixed}#fullscreenBtn:hover{color:#fff;border-color:#aaa}@media (hover:none){#fullscreenBtn:hover,#restartBtn:hover{color:#ccc;border-color:#555}}#restartBtn{bottom:calc(env(safe-area-inset-bottom,0px) + 14px);left:calc(env(safe-area-inset-left,0px) + 14px);color:#ccc;cursor:pointer;z-index:10;background:#000000b3;border:1px solid #555;padding:8px 14px;font-size:15px;position:fixed}#restartBtn:hover{color:#fff;border-color:#aaa}#driftBtn{bottom:calc(env(safe-area-inset-bottom,0px) + 14px);color:gold;z-index:10;background:#000000b3;border:1px solid gold;padding:8px 14px;font:700 15px sans-serif;text-decoration:none;position:fixed;left:50%;transform:translate(-50%)}body.touch #driftBtn{top:calc(env(safe-area-inset-top,0px) + 14px);bottom:auto}</style>
  <script type="module" crossorigin src="/assets/main-BnZNLx4U.js"></script>
  <link rel="modulepreload" crossorigin href="/assets/sound-B9pc8IP6.js">
</head>
<body>
  <div id="stage"><canvas id="peliCanvas"></canvas></div>
  <div id="rotateHint">📱 Käännä puhelin vaakaan</div>
  <button id="restartBtn">↺ Valikkoon</button>
  <a id="driftBtn" href="drift/">🏎️ Drift-peli</a>
  <button id="fullscreenBtn">⛶ Koko näyttö</button>
  <script>
    // iPhone: nipistyszoomaus ja kaksoisnapautus eivät zoomaa peliä
    document.addEventListener('gesturestart', event => event.preventDefault());
    document.addEventListener('dblclick', event => event.preventDefault());
    const btn = document.getElementById('fullscreenBtn');
    // iPhonessa koko näytön nappia ei ole: peli on koko näytöllä, kun se avataan kotivalikosta
    if (!document.documentElement.requestFullscreen) btn.style.display = 'none';
    btn.addEventListener('click', () => {
      if (document.fullscreenElement) {
        document.exitFullscreen();
        btn.textContent = '⛶ Koko näyttö';
      } else {
        document.documentElement.requestFullscreen();
        btn.textContent = '✕ Poistu';
      }
    });
  </script>
</body>
</html>
